<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Paisagem de montanhas com um ramo de cafeeiro e cerejas de café maduras" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98b"/><stop offset="0.6" stop-color="#f9e2bd"/><stop offset="1" stop-color="#fdf1dc"/>
    </linearGradient>
    <g id="folha">
      <path d="M0 0 C25 -32 85 -32 115 0 C85 32 25 32 0 0 Z" fill="#2f6b3f"/>
      <path d="M0 0 H112" stroke="#1f4a2b" stroke-width="3"/>
      <path d="M30 0 L55 -14 M30 0 L55 14 M62 0 L86 -12 M62 0 L86 12" stroke="#1f4a2b" stroke-width="2" fill="none"/>
    </g>
    <g id="cereja">
      <circle r="16" fill="#c4271f"/><circle cx="-5" cy="-6" r="5" fill="#ef6a55" opacity="0.8"/>
      <path d="M0 -16 L0 -26" stroke="#7a2418" stroke-width="3"/>
    </g>
  </defs>
  <rect width="800" height="500" fill="url(#ceu)"/>
  <circle cx="610" cy="120" r="62" fill="#f2a04a"/>
  <circle cx="610" cy="120" r="88" fill="#f2a04a" opacity="0.25"/>
  <!-- montanhas -->
  <path d="M0 330 L120 220 L210 290 L330 180 L460 300 L560 240 L680 320 L800 250 V500 H0 Z" fill="#8aa78a"/>
  <path d="M0 380 L100 310 L220 370 L350 290 L470 375 L600 320 L720 380 L800 340 V500 H0 Z" fill="#5f8a63"/>
  <!-- cafezal em linhas -->
  <path d="M0 430 C200 400 600 400 800 430 V500 H0 Z" fill="#3c6b45"/>
  <g stroke="#2c5535" stroke-width="5" opacity="0.7" fill="none">
    <path d="M0 450 C220 425 580 425 800 450"/><path d="M0 475 C220 452 580 452 800 475"/>
  </g>
  <!-- ramo -->
  <path d="M-10 90 C120 120 240 140 400 215 C500 262 590 300 690 300" fill="none" stroke="#6a4630" stroke-width="12" stroke-linecap="round"/>
  <use href="#folha" transform="translate(140 118) rotate(-52) scale(1.1)"/>
  <use href="#folha" transform="translate(180 130) rotate(48) scale(1.1)"/>
  <use href="#folha" transform="translate(300 175) rotate(-40)"/>
  <use href="#folha" transform="translate(320 185) rotate(62)"/>
  <use href="#folha" transform="translate(470 245) rotate(-30) scale(0.95)"/>
  <use href="#folha" transform="translate(490 255) rotate(70) scale(0.95)"/>
  <use href="#folha" transform="translate(610 288) rotate(-20) scale(0.8)"/>
  <use href="#cereja" transform="translate(250 172)"/>
  <use href="#cereja" transform="translate(275 190)"/>
  <use href="#cereja" transform="translate(410 228)"/>
  <use href="#cereja" transform="translate(438 244)"/>
  <use href="#cereja" transform="translate(422 262)"/>
  <use href="#cereja" transform="translate(560 288)"/>
  <!-- cereja verde (ainda por amadurecer) -->
  <g transform="translate(535 302)"><circle r="14" fill="#8db84a"/><circle cx="-4" cy="-5" r="4" fill="#c5e07f" opacity="0.8"/></g>
</svg>
