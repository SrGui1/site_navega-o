<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Chávena de café fumegante numa mesa de madeira rodeada de grãos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a13"/><stop offset="1" stop-color="#4a2f21"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4d33"/><stop offset="1" stop-color="#5a3624"/>
    </linearGradient>
    <g id="bean">
      <ellipse rx="16" ry="10" fill="#5b3524"/>
      <ellipse rx="16" ry="10" fill="none" stroke="#3a2016" stroke-width="1.5"/>
      <path d="M-14 0 C-6 -6 6 6 14 0" fill="none" stroke="#2b1810" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="290" r="250" fill="#f0b46a" opacity="0.10"/>
  <circle cx="600" cy="290" r="170" fill="#f0b46a" opacity="0.10"/>
  <!-- mesa -->
  <rect y="470" width="1200" height="130" fill="url(#mesa)"/>
  <g stroke="#4a2c1c" stroke-width="2" opacity="0.5">
    <path d="M0 505 H1200"/><path d="M0 545 H1200"/><path d="M0 583 H1200"/>
  </g>
  <!-- grãos na mesa -->
  <use href="#bean" transform="translate(250 500) rotate(-20)"/>
  <use href="#bean" transform="translate(300 530) rotate(35)"/>
  <use href="#bean" transform="translate(210 545) rotate(80)"/>
  <use href="#bean" transform="translate(950 505) rotate(15)"/>
  <use href="#bean" transform="translate(1010 535) rotate(-50)"/>
  <use href="#bean" transform="translate(900 550) rotate(60)"/>
  <use href="#bean" transform="translate(1080 500) rotate(-10)"/>
  <!-- pires -->
  <ellipse cx="600" cy="492" rx="250" ry="42" fill="#000" opacity="0.25"/>
  <ellipse cx="600" cy="478" rx="240" ry="40" fill="#f3e8d6"/>
  <ellipse cx="600" cy="474" rx="175" ry="26" fill="#e3d3b8"/>
  <!-- asa -->
  <path d="M728 330 C815 322 815 430 712 425" fill="none" stroke="#fbf4e8" stroke-width="20" stroke-linecap="round"/>
  <path d="M728 330 C815 322 815 430 712 425" fill="none" stroke="#d9c9ae" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- corpo -->
  <path d="M468 300 H732 C732 420 690 476 600 476 C510 476 468 420 468 300 Z" fill="#fbf4e8"/>
  <path d="M640 300 H732 C732 420 690 476 600 476 C630 440 640 380 640 300 Z" fill="#d9c9ae" opacity="0.55"/>
  <!-- café -->
  <ellipse cx="600" cy="300" rx="132" ry="27" fill="#fbf4e8"/>
  <ellipse cx="600" cy="302" rx="118" ry="20" fill="#3b2216"/>
  <ellipse cx="600" cy="304" rx="96" ry="14" fill="#8a5330"/>
  <ellipse cx="575" cy="300" rx="34" ry="5" fill="#b07a4c" opacity="0.7"/>
  <!-- vapor -->
  <g fill="none" stroke="#fbf4e8" stroke-width="10" stroke-linecap="round" opacity="0.45">
    <path d="M550 250 C520 215 580 190 550 150 C530 120 560 100 555 75"/>
    <path d="M605 245 C575 205 635 185 605 140 C585 110 615 90 610 60"/>
    <path d="M660 250 C635 218 690 195 662 155 C645 128 672 108 668 85"/>
  </g>
  <!-- grãos junto ao pires -->
  <use href="#bean" transform="translate(395 480) rotate(25)"/>
  <use href="#bean" transform="translate(830 484) rotate(-30)"/>
</svg>
